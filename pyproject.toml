[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-parkour-lab"
version = "0.1.0"
description = "A local-first MuJoCo humanoid parkour training and research platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "mujoco>=3.16,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
parkour = "parkour_lab.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "jsonschema>=4.23,<5", "httpx2>=2,<3"]
sim = ["mujoco>=3.16,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: end-to-end checks that run real training"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# The learning stack is NumPy-only on purpose: it runs on a CPU-only host with no CUDA.
# Optional GPU backends (MJX / MJWarp / mjlab) were not benchmarked here and are not
# dependencies; see docs/RESEARCH.md for the decision record.
